name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Flutter manually
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable _flutter
          echo "$PWD/_flutter/bin" >> $GITHUB_PATH

      - name: Find and Build APK
        run: |
          # العثور على المجلد الذي يحتوي على ملف pubspec.yaml والانتقال إليه
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path '*/.*' -print -quit)
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
